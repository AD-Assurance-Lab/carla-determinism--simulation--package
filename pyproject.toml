[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-determinism"
version = "1.3.0"
description = "Measured operating rules for deterministic CARLA measurement, and the preflight that enforces them"
requires-python = ">=3.8"
# carla is deliberately NOT a dependency: it ships as a versioned wheel/egg per CARLA
# release and every study pins its own. This package imports it lazily, inside the one
# function that needs it, so the lock check and the /proc preflight work without it.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carla_determinism = ["RULES.md", "RULES.lock"]

[tool.pytest.ini_options]
# Only tests/. A walk of src/ once let a foreign pytest plugin import the package
# from the checkout, and the suite went green with nothing installed (D-9).
testpaths = ["tests"]
